<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>次の目的地デート</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 16px; }
    .wrap { max-width: 720px; margin: 0 auto; }
    .card { border: 1px solid #ddd; border-radius: 14px; padding: 14px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    input, button { font-size: 16px; padding: 10px 12px; border-radius: 10px; border: 1px solid #ccc; }
    button { background: #fff; cursor: pointer; }
    button.primary { border-color: #333; }
    .muted { color: #666; }
    .big { font-size: 20px; }
    .ok { color: #0a7; font-weight: 700; }
    .ng { color: #c33; font-weight: 700; }
    hr { border: none; border-top: 1px solid #eee; margin: 14px 0; }
    .hidden { display: none; }
  </style>
</head>
<body>
<div class="wrap">

  <!-- LOGIN -->
  <section id="login" class="card">
    <h1>ログイン</h1>
    <p class="muted">合言葉を入力すると、最初の目的地が表示されます。</p>
    <div class="row">
      <input id="pw" type="password" placeholder="合言葉" autocomplete="off" />
      <button class="primary" id="btnLogin">開始</button>
    </div>
    <p id="loginMsg" class="muted"></p>
  </section>

  <!-- GAME -->
  <section id="game" class="card hidden">
    <div class="row" style="justify-content: space-between;">
      <h2 style="margin: 0;">次の目的地</h2>
      <button id="btnReset">最初から</button>
    </div>

    <p class="big"><b id="destName">-</b></p>
    <p id="destHint" class="muted">-</p>

    <div class="row">
      <a id="navLink" href="#" target="_blank" rel="noreferrer">Googleマップでナビ</a>
      <span class="muted">（徒歩）</span>
    </div>

    <hr>

    <div class="row">
      <button class="primary" id="btnLocate">現在地を取得</button>
      <button id="btnWatch">追跡開始</button>
      <button id="btnStop" disabled>追跡停止</button>
    </div>

    <p class="muted" id="status">未取得</p>

    <div class="row">
      <div class="card" style="flex: 1;">
        <div><b>距離</b></div>
        <div class="big" id="distance">-</div>
      </div>
      <div class="card" style="flex: 1;">
        <div><b>到達判定</b> <span class="muted">(半径 <span id="radius"></span>m)</span></div>
        <div class="big" id="arrival">-</div>
      </div>
    </div>

    <hr>

    <div id="finish" class="hidden">
      <p class="ok big">🎉 ゴール！今日はここまで。おつかれさま！</p>
      <p class="muted">（任意）ここでサプライズメッセージや次の案内を出せます。</p>
    </div>
  </section>

</div>35.75680027121871, 139.8543666793255

<script>
  /***************
   * 設定
   ***************/
  const PASSWORD = "chan-nana"; // ←合言葉を変えてね（簡易）

  const RADIUS_METERS = 60;   // ←到達判定：60m
  const DESTINATIONS = [
    // ↓ここをあなたの4つの緯度経度に置き換え
    { name: "ディナーはこちら", hint: "さて、何を食べましょうかねぇ", lat: 35.75680027121871, lng: 139.8543666793255 },
    { name: "お昼ご飯", hint: "5Fでご飯を食べましょう", lat: 35.681071986964646, lng: 139.76373048464154 },
    { name: "インターメディアテク", hint: "今日のメインですね", lat: 35.6798224957694, lng: 139.76492943203857 },
    { name: "ご休息", hint: "ちょっとお茶でも飲みませんか？", lat: 35.677933116370305, lng: 139.75848542487125 },
    { name: "ディナーはこちら", hint: "さて、何を食べましょうかねぇ", lat: 35.68430797318353, lng: 139.76505549578278 },
  ];

  /***************
   * 状態管理
   ***************/
  const LS_KEY_AUTH = "datehunt_auth";
  const LS_KEY_STAGE = "datehunt_stage";
  let watchId = null;

  const elLogin = document.getElementById("login");
  const elGame  = document.getElementById("game");
  const elPw    = document.getElementById("pw");
  const elLoginMsg = document.getElementById("loginMsg");

  const elDestName = document.getElementById("destName");
  const elDestHint = document.getElementById("destHint");
  const elNavLink  = document.getElementById("navLink");
  const elStatus   = document.getElementById("status");
  const elDistance = document.getElementById("distance");
  const elArrival  = document.getElementById("arrival");
  const elRadius   = document.getElementById("radius");
  const elFinish   = document.getElementById("finish");

  const btnLocate = document.getElementById("btnLocate");
  const btnWatch  = document.getElementById("btnWatch");
  const btnStop   = document.getElementById("btnStop");
  const btnReset  = document.getElementById("btnReset");

  elRadius.textContent = String(RADIUS_METERS);

  function getStage() {
    const raw = localStorage.getItem(LS_KEY_STAGE);
    const n = raw ? Number(raw) : 0;
    return Number.isFinite(n) ? n : 0;
  }
  function setStage(n) {
    localStorage.setItem(LS_KEY_STAGE, String(n));
  }
  function isAuthed() {
    return localStorage.getItem(LS_KEY_AUTH) === "1";
  }
  function setAuthed(v) {
    localStorage.setItem(LS_KEY_AUTH, v ? "1" : "0");
  }

  function googleNavUrl(lat, lng) {
    return `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=walking`;
  }

  // Haversine距離（m）
  function distanceMeters(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const toRad = d => d * Math.PI / 180;
    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);
    const a =
      Math.sin(dLat/2)**2 +
      Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
  }

  function renderStage() {
    const stage = getStage();

    if (stage >= DESTINATIONS.length) {
      elDestName.textContent = "完了";
      elDestHint.textContent = "すべて到達しました。";
      elNavLink.href = "#";
      elNavLink.textContent = "ナビは終了";
      elFinish.classList.remove("hidden");
      return;
    }

    const d = DESTINATIONS[stage];
    elDestName.textContent = d.name;
    elDestHint.textContent = d.hint ?? "";
    elNavLink.href = googleNavUrl(d.lat, d.lng);
    elNavLink.textContent = "Googleマップでナビ";
    elFinish.classList.add("hidden");
  }

  function enterGame() {
    elLogin.classList.add("hidden");
    elGame.classList.remove("hidden");
    renderStage();
  }
  function enterLogin() {
    elGame.classList.add("hidden");
    elLogin.classList.remove("hidden");
  }

  function updateByPosition(pos) {
    const stage = getStage();
    if (stage >= DESTINATIONS.length) return;

    const me = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    const d = DESTINATIONS[stage];
    const dist = distanceMeters(me.lat, me.lng, d.lat, d.lng);

    elStatus.textContent = `現在地: ${me.lat.toFixed(5)}, ${me.lng.toFixed(5)}（精度±${Math.round(pos.coords.accuracy)}m）`;
    elDistance.textContent = dist >= 1000 ? `${(dist/1000).toFixed(2)} km` : `${Math.round(dist)} m`;

    if (dist <= RADIUS_METERS) {
      elArrival.innerHTML = `<span class="ok">到達！</span>`;
      setStage(stage + 1);
      renderStage();
    } else {
      elArrival.innerHTML = `<span class="ng">未到達</span>`;
    }
  }

  function getOnce() {
    if (!navigator.geolocation) {
      alert("このブラウザは位置情報に対応していません。");
      return;
    }
    navigator.geolocation.getCurrentPosition(
      updateByPosition,
      (err) => alert("位置情報を取得できませんでした: " + err.message),
      { enableHighAccuracy: true, timeout: 8000, maximumAge: 3000 }
    );
  }

  function startWatch() {
    if (watchId != null) return;
    if (!navigator.geolocation) {
      alert("このブラウザは位置情報に対応していません。");
      return;
    }
    watchId = navigator.geolocation.watchPosition(
      updateByPosition,
      (err) => alert("追跡エラー: " + err.message),
      { enableHighAccuracy: true, timeout: 12000, maximumAge: 3000 }
    );
    btnStop.disabled = false;
    btnWatch.disabled = true;
    elStatus.textContent = "追跡中…";
  }

  function stopWatch() {
    if (watchId == null) return;
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
    btnStop.disabled = true;
    btnWatch.disabled = false;
    elStatus.textContent = "追跡停止";
  }

  // Login
  document.getElementById("btnLogin").addEventListener("click", () => {
    if (elPw.value === PASSWORD) {
      setAuthed(true);
      if (!localStorage.getItem(LS_KEY_STAGE)) setStage(0);
      enterGame();
    } else {
      elLoginMsg.textContent = "合言葉が違います。";
    }
  });

  // Buttons
  btnLocate.addEventListener("click", getOnce);
  btnWatch.addEventListener("click", startWatch);
  btnStop.addEventListener("click", stopWatch);

  btnReset.addEventListener("click", () => {
    stopWatch();
    setStage(0);
    renderStage();
    elStatus.textContent = "リセットしました";
    elDistance.textContent = "-";
    elArrival.textContent = "-";
  });

  // 初期表示
  if (isAuthed()) enterGame();
  else enterLogin();
</script>
</body>
</html>
